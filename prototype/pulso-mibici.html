const {Deck, ColumnLayer, ArcLayer, LineLayer, TextLayer, TripsLayer, ScatterplotLayer} = deck;
const D = DATA, K = D.k;
const byId = new Map(D.st.map(s => [s.id, s]));
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hex = h => { h = h.replace('#',''); return [parseInt(h.slice(0,2),16), parseInt(h.slice(2,4),16), parseInt(h.slice(4,6),16)]; };
const C = {drain: hex(css('--drain')), fill: hex(css('--fill')), even: hex(css('--even')), trail: hex(css('--trail')), line: hex(css('--line')), mute: hex(css('--mute'))};
const fmt = n => n.toLocaleString('es-MX');
const pad = n => String(n).padStart(2,'0');

document.getElementById('period').textContent = `Guadalajara, Zapopan y Tlaquepaque · ${K.from} a ${K.to} · ${fmt(K.stations)} estaciones`;
document.getElementById('kpis').innerHTML = [
  [fmt(K.trips), 'viajes válidos'], [fmt(K.per_day), 'viajes por día'],
  [K.median_min + ' min', 'duración mediana'], [pad(K.peak_hour) + ':00', 'hora pico'],
].map(([v,l]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');

let hour = null, selected = null, playing = !matchMedia('(prefers-reduced-motion: reduce)').matches;
let t = 420, show = {cols: true, arcs: true, trips: true};

function stat(s, h) {
  const dep = h == null ? s.dep : s.hd[h], arr = h == null ? s.arr : s.ha[h];
  const tot = dep + arr, net = arr - dep, ratio = tot ? net / tot : 0;
  return {dep, arr, tot, net, ratio, kind: ratio < -0.1 ? 'Se vacía' : ratio > 0.1 ? 'Se llena' : 'Equilibrada'};
}
function color(ratio, a = 235) {
  const r = Math.max(-1, Math.min(1, ratio * 2.2));
  const [x, y] = r < 0 ? [C.even, C.drain] : [C.even, C.fill];
  const k = Math.abs(r);
  return [0,1,2].map(i => Math.round(x[i] + (y[i] - x[i]) * k)).concat(a);
}

// Faint survey grid instead of a basemap: every 0.01 degrees (about 1.1 km).
const lats = D.st.map(s => s.lat), lons = D.st.map(s => s.lon);
const box = {s: Math.min(...lats) - .01, n: Math.max(...lats) + .01, w: Math.min(...lons) - .01, e: Math.max(...lons) + .01};
const grid = [];
for (let x = Math.ceil(box.w * 100) / 100; x <= box.e; x += .01) grid.push({a: [x, box.s], b: [x, box.n]});
for (let y = Math.ceil(box.s * 100) / 100; y <= box.n; y += .01) grid.push({a: [box.w, y], b: [box.e, y]});

const muniCenters = Object.entries(D.st.reduce((m, s) => { (m[s.m] ||= []).push(s); return m; }, {})).map(([m, list]) => ({
  name: {GDL: 'Guadalajara', ZPN: 'Zapopan', TLQ: 'Tlaquepaque'}[m] || m,
  pos: [list.reduce((a, s) => a + s.lon, 0) / list.length, list.reduce((a, s) => a + s.lat, 0) / list.length]}));

const trips = D.trips.filter(([o, d]) => byId.has(o) && byId.has(d)).map(([o, d, start, dur]) => {
  const a = byId.get(o), b = byId.get(d);
  return {path: [[a.lon, a.lat], [b.lon, b.lat]], ts: [start, start + Math.max(2, dur)]};
});

function layers() {
  const h = hour, maxTot = Math.max(...D.st.map(s => stat(s, h).tot)) || 1;
  const out = [
    new LineLayer({id: 'grid', data: grid, getSourcePosition: d => d.a, getTargetPosition: d => d.b, getColor: [...C.line, 90], getWidth: 1}),
    new TextLayer({id: 'muni', data: muniCenters, getPosition: d => d.pos, getText: d => d.name.toUpperCase(), getSize: 13, getColor: [...C.mute, 150],
      fontFamily: 'Archivo, sans-serif', fontWeight: 600, characterSet: 'auto', getPixelOffset: [0, -90], billboard: true}),
  ];
  if (show.cols) out.push(new ColumnLayer({
    id: 'cols', data: D.st, diskResolution: 12, radius: 48, extruded: true, pickable: true,
    getPosition: s => [s.lon, s.lat], getElevation: s => stat(s, h).tot / maxTot * 1800,
    getFillColor: s => s.id === selected ? [255,255,255,255] : color(stat(s, h).ratio),
    material: {ambient: .55, diffuse: .6, shininess: 24},
    updateTriggers: {getElevation: h, getFillColor: [h, selected]},
    transitions: {getElevation: 400},
    onClick: ({object}) => { selected = object ? object.id : null; renderStation(); render(); },
  }));
  if (show.arcs) {
    const flows = selected ? D.flows.filter(f => f[0] === selected || f[1] === selected) : D.flows.slice(0, 220);
    const maxF = Math.max(...flows.map(f => f[2]), 1);
    out.push(new ArcLayer({
      id: 'arcs', data: flows, pickable: true, greatCircle: false, getHeight: .6,
      getSourcePosition: f => [byId.get(f[0]).lon, byId.get(f[0]).lat], getTargetPosition: f => [byId.get(f[1]).lon, byId.get(f[1]).lat],
      getSourceColor: [...C.drain, 200], getTargetColor: [...C.fill, 200], getWidth: f => 1 + 6 * f[2] / maxF,
      updateTriggers: {getWidth: selected},
    }));
  }
  if (show.trips) out.push(new TripsLayer({
    id: 'trips', data: trips, getPath: d => d.path, getTimestamps: d => d.ts, getColor: C.trail,
    widthMinPixels: 2, trailLength: 9, currentTime: t, fadeTrail: true, capRounded: true,
  }));
  if (selected) { const s = byId.get(selected); out.push(new ScatterplotLayer({id: 'ring', data: [s], getPosition: s => [s.lon, s.lat], getRadius: 160, stroked: true, filled: false, getLineColor: [255,255,255,220], lineWidthMinPixels: 2})); }
  return out;
}

const deckgl = new Deck({
  parent: document.getElementById('map'),
  initialViewState: innerWidth < 760 ? {longitude: -103.375, latitude: 20.632, zoom: 11.4, pitch: 50, bearing: -18} : {longitude: -103.372, latitude: 20.673, zoom: 12.2, pitch: 55, bearing: -18},
  controller: true, layers: [],
  getTooltip: ({object, layer}) => {
    if (!object) return null;
    if (layer.id === 'cols') { const x = stat(object, hour); return {html: `<b>${object.c}</b> ${object.n}<br>${fmt(x.dep)} salidas · ${fmt(x.arr)} llegadas<br>${x.kind}`, className: 'tip'}; }
    if (layer.id === 'arcs') return {html: `${byId.get(object[0]).n} → ${byId.get(object[1]).n}<br>${fmt(object[2])} viajes en el mes`, className: 'tip'};
    return null;
  },
});
function render() { deckgl.setProps({layers: layers()}); }

function spark(canvas, s) {
  const dpr = devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w * dpr; canvas.height = h * dpr;
  const g = canvas.getContext('2d'); g.scale(dpr, dpr);
  const max = Math.max(...s.hd, ...s.ha, 1), bw = w / 24;
  g.strokeStyle = css('--line'); g.beginPath(); g.moveTo(0, h - 14.5); g.lineTo(w, h - 14.5); g.stroke();
  for (let i = 0; i < 24; i++) {
    const a = (s.hd[i] / max) * (h - 20), b = (s.ha[i] / max) * (h - 20);
    g.fillStyle = css('--drain'); g.fillRect(i * bw + 1, h - 15 - a, bw / 2 - 1, a);
    g.fillStyle = css('--fill'); g.fillRect(i * bw + bw / 2, h - 15 - b, bw / 2 - 1, b);
  }
  if (hour != null) { g.strokeStyle = css('--trail'); g.strokeRect(hour * bw + .5, 2.5, bw - 1, h - 17); }
  g.fillStyle = css('--mute'); g.font = '10px IBM Plex Mono, monospace';
  for (const x of [0, 6, 12, 18]) g.fillText(pad(x), x * bw + 1, h - 3);
}

function renderStation() {
  const el = document.getElementById('station');
  if (!selected) {
    const ranked = [...D.st].filter(s => s.dep + s.arr >= 1500).sort((a, b) => (a.arr - a.dep) - (b.arr - b.dep));
    const pick = (s, k) => `<button class="chip" data-id="${s.id}">${s.c} · ${k} ${fmt(Math.abs(s.arr - s.dep))}</button>`;
    el.innerHTML = `<h2>Dónde mirar primero</h2><p class="note">Las estaciones con más desequilibrio en el mes. Toca una columna o un nombre.</p>
      <div class="layers">${ranked.slice(0, 3).map(s => pick(s, '−')).join('')}${ranked.slice(-3).reverse().map(s => pick(s, '+')).join('')}</div>`;
    el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => focus(+b.dataset.id));
    return;
  }
  const s = byId.get(selected), x = stat(s, null), xh = hour == null ? null : stat(s, hour);
  const tagColor = x.kind === 'Se vacía' ? 'var(--drain)' : x.kind === 'Se llena' ? 'var(--fill)' : 'var(--even)';
  const top = D.flows.filter(f => f[0] === s.id).slice(0, 3).map(f => `${byId.get(f[1]).c} (${fmt(f[2])})`).join(', ') || 'sin rutas en el top';
  el.innerHTML = `<span class="code">${s.c} · capacidad ${s.cap} anclajes</span><h2>${s.n}</h2>
    <div><span class="tag" style="background:${tagColor}">${x.kind}</span></div>
    <div class="row"><span>${fmt(x.dep)} salidas</span><span>${fmt(x.arr)} llegadas</span><span>neto ${x.net > 0 ? '+' : ''}${fmt(x.net)}</span></div>
    ${xh ? `<div class="row"><span>A las ${pad(hour)}:00 →</span><span>${fmt(xh.dep)} sal.</span><span>${fmt(xh.arr)} lleg.</span></div>` : ''}
    <canvas class="spark" id="spark" aria-label="Salidas y llegadas por hora"></canvas>
    <p class="note">Naranja: salidas. Azul: llegadas. Destinos más comunes: ${top}.</p>
    <button class="chip" id="clear">Ver toda la red</button>`;
  spark(document.getElementById('spark'), s);
  document.getElementById('clear').onclick = () => { selected = null; renderStation(); render(); };
}
function focus(id) {
  selected = id; const s = byId.get(id);
  deckgl.setProps({initialViewState: {longitude: s.lon, latitude: s.lat, zoom: 13.6, pitch: 58, bearing: -18, transitionDuration: 900}});
  renderStation(); render();
}

for (const [k, id] of [['cols', 'l-cols'], ['arcs', 'l-arcs'], ['trips', 'l-trips']]) {
  const b = document.getElementById(id);
  b.onclick = () => { show[k] = !show[k]; b.setAttribute('aria-pressed', show[k]); render(); };
}
const slider = document.getElementById('slider'), clock = document.getElementById('clock'), play = document.getElementById('play'), mode = document.getElementById('mode');
function setTime(v, fromUser) {
  t = v; slider.value = Math.floor(v);
  clock.textContent = `${pad(Math.floor(v / 60))}:${pad(Math.floor(v % 60))}`;
  const h = Math.floor(v / 60);
  if (fromUser || h !== hour) { hour = h; mode.textContent = `Columnas: hora ${pad(h)} · viajes del ${K.anim_day}`; renderStation(); }
  render();
}
slider.oninput = () => { playing = false; play.textContent = 'Reproducir'; setTime(+slider.value, true); };
play.onclick = () => { playing = !playing; play.textContent = playing ? 'Pausa' : 'Reproducir'; };
if (!playing) play.textContent = 'Reproducir';
let last = performance.now();
function tick(now) {
  if (playing) { const v = (t + (now - last) / 1000 * 30) % 1440; setTime(v < 300 && t > 1400 ? 300 : v); }
  last = now; requestAnimationFrame(tick);
}
setTime(420, true); renderStation(); requestAnimationFrame(tick);
</script>
